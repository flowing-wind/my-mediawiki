# Wiki remains an independent name-based virtual host.
<VirtualHost *:80>
    ServerName wiki.flowing-wind.space
    # Certbot's local validation server; available only during issuance/renewal.
    ProxyPass /.well-known/acme-challenge/ http://127.0.0.1:8088/.well-known/acme-challenge/
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://wiki.flowing-wind.space%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:8080>
    ServerName 8.159.132.20
    Redirect permanent / https://wiki.flowing-wind.space/
</VirtualHost>

<VirtualHost *:443>
    ServerName wiki.flowing-wind.space
    DocumentRoot /var/www/mediawiki/public
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/wiki.flowing-wind.space/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/wiki.flowing-wind.space/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    php_admin_flag pcre.jit Off
    <Directory /var/www/mediawiki/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <Directory /var/www/mediawiki/public/w>
        AllowOverride All
    </Directory>
    RewriteEngine On
    RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/w/index.php [L]
    RewriteRule ^/?$ /w/ [R=302,L]
    ErrorLog ${APACHE_LOG_DIR}/mediawiki-error.log
    CustomLog ${APACHE_LOG_DIR}/mediawiki-access.log combined
</VirtualHost>
