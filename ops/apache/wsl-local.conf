<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    php_admin_flag pcre.jit Off
    DocumentRoot /home/fuuraiko/Projects/MediaWiki/public

    <Directory /home/fuuraiko/Projects/MediaWiki/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <Directory /home/fuuraiko/Projects/MediaWiki/public/w>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    RewriteEngine On
    RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/w/index.php [L]
    RewriteRule ^/?$ /w/ [R=302,L]
    ErrorLog ${APACHE_LOG_DIR}/mediawiki-error.log
    CustomLog ${APACHE_LOG_DIR}/mediawiki-access.log combined
</VirtualHost>
